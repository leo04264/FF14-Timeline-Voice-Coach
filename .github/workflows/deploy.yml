name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # actions/deploy-pages 從 v4 起就記載需要這個權限才能讀取 artifact。
  # 指定 permissions 區塊之後，沒列出的權限一律是 none。
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 20 於 2026-04-30 EOL。22 是 LTS（支援到 2027-04-30），
          # 也比 24 更接近 Vite 5 / Vitest 2 實際被測試過的環境。
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
        env:
          # Repository name; change if the repo is renamed.
          BASE_PATH: /FF14-Timeline-Voice-Coach/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
